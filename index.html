<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHAUDHARYRAJ - Hacker App Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #00ff66;
    }

    header {
      text-align: center;
      padding: 20px;
      border-bottom: 2px solid #00ff66;
      box-shadow: 0 0 15px #00ff66;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
      text-shadow: 0 0 10px #00ff66;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 20px;
      gap: 20px;
    }

    .app-card {
      background: #111;
      border: 1px solid #00ff66;
      border-radius: 15px;
      width: 220px;
      text-align: center;
      padding: 15px;
      box-shadow: 0 0 10px #00ff66;
      transition: 0.3s;
    }

    .app-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #00ff66;
    }

    .app-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
    }

    .app-card h3 {
      margin: 12px 0;
      color: #00ff66;
    }

    .btn {
      display: inline-block;
      padding: 10px 15px;
      background: #00ff66;
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 15px;
      border-top: 1px solid #00ff66;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h1>⚡ CHAUDHARYRAJ ⚡</h1>
    <p>Daily New Apps Download Hub</p>
  </header>

  <div class="container">

    <!-- App 1 -->
    <div class="app-card">
      <img src="https://upload.wikimedia.org/wikipedia/commons/9/95/Instagram_logo_2022.svg" alt="Instagram">
      <h3>Instagram</h3>
      <a class="btn" href="https://play.google.com/store/apps/details?id=com.instagram.android" target="_blank">Download</a>
    </div>

    <!-- App 2 -->
    <div class="app-card">
      <img src="https://github.com/chaudharyraj02692-raj/chaudhary/blob/main/WhatsApp%20Image%202026-08-09%20at%208.44.30%20PM.jpeg?raw=true="Chaipatti">
      <h3>Chaipatti</h3>
      <a class="btn" href=" https://wroii.swiworkflow.co/pages/signup/?ref=0722F3="_blank">Download</a>
    </div>

  </div>

  <footer>
    © 2026 CHAUDHARYRAJ | Hacker Style App Website
  </footer>

</body>
</html>
